<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Life">
<title>Life</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-shell">

  <!-- HEADER -->
  <header class="top-bar">
    <div class="top-bar-inner">
      <span class="top-date" id="topDate"></span>
      <span class="top-title" id="topTitle">Aseo</span>
      <span class="top-streak" id="topStreak"></span>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="main-content" id="app"></main>

  <!-- TAB BAR -->
  <nav class="tab-bar">
    <button class="tab-btn active" onclick="nav('aseo')" data-tab="aseo">
      <span class="tab-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </span>
      <span class="tab-label">Aseo</span>
    </button>
    <button class="tab-btn" onclick="nav('trabajo')" data-tab="trabajo">
      <span class="tab-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
      </span>
      <span class="tab-label">Trabajo</span>
    </button>
    <button class="tab-btn" onclick="nav('estudio')" data-tab="estudio">
      <span class="tab-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      </span>
      <span class="tab-label">Estudio</span>
    </button>
    <button class="tab-btn" onclick="nav('economia')" data-tab="economia">
      <span class="tab-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      </span>
      <span class="tab-label">Economía</span>
    </button>
    <button class="tab-btn" onclick="nav('food')" data-tab="food">
      <span class="tab-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
      </span>
      <span class="tab-label">Comida</span>
    </button>
    <button class="tab-btn" onclick="nav('gym')" data-tab="gym">
      <span class="tab-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
      </span>
      <span class="tab-label">Gym</span>
    </button>
    <button class="tab-btn" onclick="nav('diario')" data-tab="diario">
      <span class="tab-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      </span>
      <span class="tab-label">Diario</span>
    </button>
  </nav>

</div>

<!-- MODAL OVERLAY -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal()"></div>
<div class="modal-sheet" id="modalSheet">
  <div class="modal-handle"></div>
  <div class="modal-body" id="modalBody"></div>
</div>

<script src="app.js"></script>
</body>
</html>
